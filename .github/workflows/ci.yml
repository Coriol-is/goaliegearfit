name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PUBLIC_SITE_ORIGIN: https://goaliegearfit.com

jobs:
  gates:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify-dataset # sha256 + schema + fixture count (ENG-04)
      - run: npx astro check # typecheck
      - run: npx vitest run # smoke now; 72 fixtures + properties from Plan 03 (ENG-02/03)
      - run: npm run build # astro build -> dist/ (prebuild re-runs verify-dataset)
      - run: npm run scan-dist # no-snapshot allowlist (DEPL-02)
      - run: npm run audit:seo

  verify-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [gates]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Verify Git-integrated Cloudflare Pages deployment
        run: node scripts/verify-live.mjs
        env:
          SITE_ORIGIN: https://goaliegearfit.com
